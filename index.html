<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DevOps Practice — 2026 Interview Q&amp;A Handbook</title>
    <meta
      name="description"
      content="Interactive DevOps, Cloud, SRE & Platform Engineering interview Q&A handbook covering 1 to 5+ years experience with 2026 trends."
    />
    <meta property="og:title" content="DevOps Practice — 2026 Interview Q&A Handbook" />
    <meta
      property="og:description"
      content="Interactive DevOps, Cloud, SRE & Platform Engineering interview Q&A handbook covering 1 to 5+ years experience with 2026 trends."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2558d9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dp_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#1b1d22');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
